name: Build_ax6000_immortalwrt_hanwckf

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:

  schedule:
    # UTC 时间对应北京时间（UTC+8=北京时间）：7月20日，早上4点10分 开始编译
    - cron: '10 20 01 10 *'  
    # UTC 时间对应北京时间：每月2、9、16、23日，早上4点10分 开始编译    
    #- cron: '10 20 1,8,15,22 * *'

permissions:
  contents: write
    
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        temp-reserve-mb: 512
        swap-size-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        overprovision-lvm: 'true'
        build-mount-path: '/builder'        

    - name: Prepare Builder Directory
      run: |
        sudo mkdir -p /builder
        sudo chown -R runner:runner /builder
        df -hT

    - name: Checkout repository
      uses: actions/checkout@v7        

    # 如果“Initialization environment”报错，是因为官方 APT 设置依赖项的脚本已经不合时宜，在官方修正之前，请使用下方的代码
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
        /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE    

    # 使用此代码前，请先更新依赖包的命令：https://github.com/sky2016cn/AutoBuild-lede（依赖包仓库） 
    #- name: Initialization environment
    #  env:
    #    DEBIAN_FRONTEND: noninteractive
    #  run: |
    #    sudo -E apt-get -qq update
    #    sudo -E apt-get -qq install $(curl -fsSL raw.githubusercontent.com/sky2016cn/OpenWrt-Depends/main/depends-immortalwrt_mt798x)
    #    sudo -E apt-get -qq autoremove --purge
    #    sudo -E apt-get -qq clean
    #    sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
    #    /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
    #    sudo timedatectl set-timezone "Asia/Shanghai"
    #    sudo chown $USER:$GROUPS $GITHUB_WORKSPACE    
        
    - name: Check Space
      run: |
        df -h

       # 注意：immortalwrt_mt798x强烈不建议自行更新源码中的插件，导致编译失败，也不建议添加第三方插件，造成固件不稳定，打开官方插件库查询：https://github.com/hanwckf/immortalwrt-mt798x/blob/openwrt-21.02/feeds.conf.default（注意 luci后面的分支，打开 luci仓库中正确的分支找到“applications”查询插件）
    - name: Clone source code
      env: 
        REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
      run: |
        # 打开官网：https://github.com/hanwckf/immortalwrt-mt798x
        # 在升级的分支，找到“Quickstart”下方：5. 看到 "# MT7986" 配置文件命令：cp -f defconfig/mt7986-ax6000.config .config 可确认该分支包含 红米AX6000官方原厂闭源
        # 获取克隆命令：找到“Quickstart”下方：1. 克隆命令中包含“https://github.....”，替换上方变量“REPO_URL: https://github.....”，再替换下方的 openwrt-21.02 分支名称
        git clone --depth 1 -b openwrt-21.02 "$REPO_URL" /builder/openwrt || { echo 'Git clone failed!'; exit 1; }
                    
    - name: Update feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds update -a

    - name: Install feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds install -a

    - name: Install feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds install -a

       # ======== 1. 编译 OpenClash 最新版（使用 package 编译法，更新和安装 feeds 命令之后）推荐 =========
       # 不推荐使用写入 ./feeds.conf.default 编译法
       # immortalwrt 插件库已经包含 OpenClash，若源码被删除或编译 OpenClash 最新版，使用以下命令自行编译，打开 immortalwrt官方插件库查询：https://github.com/immortalwrt/immortalwrt（选择 openwrt-24.10分支，打开 feeds.conf.default文件，再打开luci仓库找到“applications”查询插件）
    - name: Import Official Recommended OpenClash
      working-directory: /builder/openwrt
      run: |
        # 移除 openwrt feeds 自带的核心库，
        rm -rf package/luci-app-openclash
        rm -rf feeds/luci/applications/luci-app-openclash

        # 克隆 OpenClash 最新版
        git clone --depth=1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash

        # 只移动 luci-app-openclash 软件包到 package 目录下
        mv /tmp/OpenClash/luci-app-openclash package/

        # 删除临时目录
        rm -rf tmp

    - name: Configuration Customization - Build_ax6000_immortalwrt_hanwckf
      run: |
        # 在升级的分支，找到“Quickstart”下方：5. 看到 "# MT7986" 配置文件命令：cp -f defconfig/mt7986-ax6000.config .config 可确认该分支包含 红米AX6000官方原厂闭源
        # 将配置文件从 defconfig 目录复制到根目录并重命名 .config，云编译的目录和官方目录不同，所以命令中必须修改路径
        cp -f /builder/openwrt/defconfig/mt7986-ax6000.config /builder/openwrt/.config
    
        # 追加你要的插件配置，打开 feeds.conf.default文件，再打开luci仓库，选择“openwrt-21.02”分支，找到“applications”查询插件
        cat >> /builder/openwrt/.config <<EOF
        CONFIG_PACKAGE_luci-app-autoreboot=y
        CONFIG_PACKAGE_luci-app-msd_lite=y
        CONFIG_PACKAGE_luci-app-openclash=y
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
        EOF

        # 导入 customize_immortalwrt.sh 文件
        chmod +x ./customize_immortalwrt.sh && ./customize_immortalwrt.sh
        cd /builder/openwrt && make defconfig
        
    - name: Download package
      working-directory: /builder/openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      working-directory: /builder/openwrt
      run: |
        echo -e "$(nproc) thread build."
        # 先尝试多线程全速编译，如果失败（返回非 0 状态码），则触发单线程编译，并打印最详细的 V=s 日志
        make -j$(nproc) || make -j1 V=s

    - name: Check Space
      run: |
        df -h
        
    - name: Build firmware
      working-directory: /builder/openwrt
      # 编译超过 5 小时，自动退出编译，防止后台静默卡死
      timeout-minutes: 300
      env:
        # 禁用 Git 终端交互提示，遇到需要输入密码或确认时，自动退出编译，防止后台静默卡死
        GIT_TERMINAL_PROMPT: 0
        # 禁用 Git 隐式文件锁，避免在多进程/并发 Git 操作时因锁争用导致的异常
        GIT_OPTIONAL_LOCKS: 0
      run: |
        echo -e "$(nproc) thread build."
        # 先尝试多线程全速编译，如果失败（返回非 0 状态码），则触发单线程编译，重新编译并输出详细日志
        make -j$(nproc) || make -j1 V=s

    - name: Check Space
      run: |
        df -h

    - name: Organize Files (整理固件与插件)
      id: organize
      working-directory: /builder/openwrt
      if: success() && !cancelled()
      run: |
        # 1. 创建专门存放固件的临时目录
        mkdir -p /tmp/firmware

        # 2. 定位 targets 编译产物目录（在绝对路径 /builder/openwrt/bin/targets/ 下寻找）
        TARGET_DIR=$(find /builder/openwrt/bin/targets/ -maxdepth 2 -mindepth 2 -type d | head -n 1)
        
        if [ -d "$TARGET_DIR" ]; then
          # 复制所有 targets 镜像、itb 文件、manifest、bl2.bin、sha256sums 等
          cp -r $TARGET_DIR/* /tmp/firmware/ 2>/dev/null || true
        fi

        # 3. 复制并重命名配置文件
        cp /builder/openwrt/.config /tmp/firmware/config.buildinfo 2>/dev/null || true
        cp /builder/openwrt/.config /tmp/firmware/build.config 2>/dev/null || true

        # 4. 打包所有编译生成的 ipk/apk 插件为 Packages.tar.gz
        if [ -d "/builder/openwrt/bin/packages" ]; then
            mkdir -p /tmp/pkg_temp
            # 同时兼容 ipk 和 apk 两种安装包格式
            find /builder/openwrt/bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -f {} /tmp/pkg_temp/ \;
            tar -zcf /tmp/firmware/Packages.tar.gz -C /tmp pkg_temp
            rm -rf /tmp/pkg_temp
        fi

        # 5. 精准清理不需要的临时 Packages 文件夹和多余的中间 buildinfo
        rm -rf /tmp/firmware/packages /tmp/firmware/feeds.buildinfo /tmp/firmware/version.buildinfo 2>/dev/null || true

        # ===============================================================
        # 👇【修改区】修改成脚本的名称
        FIRMWARE_TYPE="Build_ax6000_immortalwrt_hanwckf"
        # ===============================================================

        # 6. 将 FIRMWARE_TYPE 连同 TAG 和 NAME 一起写入 GITHUB_ENV 传递给后续步骤
        echo "FIRMWARE_TYPE=${FIRMWARE_TYPE}" >> $GITHUB_ENV
        echo "RELEASE_TAG=${FIRMWARE_TYPE}_$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
        echo "RELEASE_NAME=${FIRMWARE_TYPE} [$(date +'%Y.%m.%d')]" >> $GITHUB_ENV

    - name: Upload firmware to Release (发布至 GitHub Release)
      uses: softprops/action-gh-release@v3
      if: success() && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: '${{ env.RELEASE_TAG }}'
        name: '${{ env.RELEASE_NAME }}'
        body: |
          ### 固件信息
          ${{ env.FIRMWARE_TYPE }}
        files: /tmp/firmware/*
